name: Release

# Pushing a tag like v0.1.0 builds the app, makes the installer and a portable zip, and
# publishes them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version from the tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        run: cargo test --lib

      - name: Build
        run: cargo build --release --bin whatsapp-gpui

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\whatsapp-gpui.iss

      - name: Make the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\release\whatsapp-gpui.exe, README.md, LICENSE, NOTICE `
            -DestinationPath "dist\whatsapp-gpui-$env:APP_VERSION-portable.zip" -Force

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/whatsapp-gpui-setup-${{ env.APP_VERSION }}.exe
            dist/whatsapp-gpui-${{ env.APP_VERSION }}-portable.zip
