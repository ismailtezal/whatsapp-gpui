[package]
name = "whatsapp-gpui"
version = "0.2.0"
edition = "2024"

[dependencies]
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "7e5c198e1a25ea405faa7a69a47bc727ea15484c", features = ["voip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
gpui-component = "0.9.1"
rusqlite = "0.40"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-kit-assets = "0.9.1"
anyhow = "1.0.104"
rust-embed = "8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ab_glyph = "0.2"
lyon = "1.0"
ureq = "3.5"
windows = { version = "0.62", features = ["Media_Playback", "Media_Core", "Foundation", "Storage", "Storage_FileProperties", "Storage_Streams", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading"] }
sha2 = "0.10"
raw-window-handle = "0.6"
cpal = "0.18"
ogg = "0.9"
unsafe-libopus = "0.2"
emojis = "0.6"

[build-dependencies]
winresource = "0.1"

# Local copies of two GPUI crates, patched to add a glass background (backdrop blur and
# refraction) that upstream GPUI does not have. See vendor/README.md.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

# The interface must stay at the screen's refresh rate, so the release build is
# optimized across crates. This makes release builds slower to compile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
