[package]
name = "whatsapp-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "7e5c198e1a25ea405faa7a69a47bc727ea15484c" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
gpui-component = "0.9.1"
rusqlite = "0.40"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-kit-assets = "0.9.1"
anyhow = "1.0.104"
rust-embed = "8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ureq = "3.5"
windows = { version = "0.62", features = ["Media_Playback", "Media_Core", "Foundation", "Storage", "Storage_FileProperties", "Storage_Streams", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation"] }
sha2 = "0.10"
